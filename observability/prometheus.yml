global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-dev'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:8080'] # api-gateway
      - targets: ['host.docker.internal:8081'] # vendas-service
      - targets: ['host.docker.internal:8082'] # estoque-service
      - targets: ['host.docker.internal:8083'] # pagamento-service
      - targets: ['host.docker.internal:8085'] # transportadora-service
      - targets: ['host.docker.internal:8086'] # notificacao-service
