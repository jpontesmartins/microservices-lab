version: "3.9"

# Docker Compose para PRODUCAO
# Stack completa com HTTPS, sem ports expostos na host, logs com rotacao

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8087
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
      KC_HTTP_PORT: 8443
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
      - ./certs:/opt/keycloak/certs:ro
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "get", "/realms/master"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  discovery:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME:-localhost}:8443/realms/microservices
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vendas-service:
    build:
      context: ./vendas-service
      dockerfile: Dockerfile
    container_name: vendas-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres-vendas:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vendas:5432/${POSTGRES_VENDAS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_VENDAS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_VENDAS_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME:-localhost}:8443/realms/microservices
      - SERVICE_TOKEN_CLIENT_SECRET=${KEYCLOAK_VENDAS_SECRET}
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  estoque-service:
    build:
      context: ./estoque-service
      dockerfile: Dockerfile
    container_name: estoque-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres-estoque:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-estoque:5432/${POSTGRES_ESTOQUE_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_ESTOQUE_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_ESTOQUE_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME:-localhost}:8443/realms/microservices
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frete-service:
    build:
      context: ./frete-service
      dockerfile: Dockerfile
    container_name: frete-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME:-localhost}:8443/realms/microservices
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pagamento-service:
    build:
      context: ./pagamento-service
      dockerfile: Dockerfile
    container_name: pagamento-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres-pagamento:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-pagamento:5432/${POSTGRES_PAGAMENTO_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_PAGAMENTO_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PAGAMENTO_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://${KEYCLOAK_HOSTNAME:-localhost}:8443/realms/microservices
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  transportadora-service:
    build:
      context: ./transportadora-service
      dockerfile: Dockerfile
    container_name: transportadora-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notificacao-service:
    build:
      context: ./notificacao-service
      dockerfile: Dockerfile
    container_name: notificacao-service
    restart: always
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
    networks:
      - ms-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-vendas:
    image: postgres:14
    container_name: postgres-vendas
    environment:
      POSTGRES_DB: ${POSTGRES_VENDAS_DB}
      POSTGRES_USER: ${POSTGRES_VENDAS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_VENDAS_PASSWORD}
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-estoque:
    image: postgres:14
    container_name: postgres-estoque
    environment:
      POSTGRES_DB: ${POSTGRES_ESTOQUE_DB}
      POSTGRES_USER: ${POSTGRES_ESTOQUE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ESTOQUE_PASSWORD}
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-pagamento:
    image: postgres:14
    container_name: postgres-pagamento
    environment:
      POSTGRES_DB: ${POSTGRES_PAGAMENTO_DB}
      POSTGRES_USER: ${POSTGRES_PAGAMENTO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAGAMENTO_PASSWORD}
    networks:
      - ms-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ms-net:
    driver: bridge
