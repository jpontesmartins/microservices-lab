spring:
  application:
    name: estoque-service

  datasource:
    url: jdbc:h2:mem:estoque-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8082

eureka:
  instance:
    instance-id: estoque-service:test
