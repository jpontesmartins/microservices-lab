spring:
  application:
    name: estoque-service

  datasource:
    url: jdbc:h2:mem:estoque-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0/realms/test

eureka:
  client:
    enabled: false

management:
  zipkin:
    tracing:
      enabled: false
  tracing:
    enabled: false

server:
  port: 8082
