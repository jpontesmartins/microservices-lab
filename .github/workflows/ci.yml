name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "api-gateway/**"
      - "discovery-server/**"
      - "vendas-service/**"
      - "estoque-service/**"
      - "frete-service/**"
      - "pagamento-service/**"
      - "transportadora-service/**"
      - "notificacao-service/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "api-gateway/**"
      - "discovery-server/**"
      - "vendas-service/**"
      - "estoque-service/**"
      - "frete-service/**"
      - "pagamento-service/**"
      - "transportadora-service/**"
      - "notificacao-service/**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            discovery-server:
              - 'discovery-server/**'
            vendas-service:
              - 'vendas-service/**'
            estoque-service:
              - 'estoque-service/**'
            frete-service:
              - 'frete-service/**'
            pagamento-service:
              - 'pagamento-service/**'
            transportadora-service:
              - 'transportadora-service/**'
            notificacao-service:
              - 'notificacao-service/**'

  build-and-test:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-server
          - vendas-service
          - estoque-service
          - frete-service
          - pagamento-service
          - transportadora-service
          - notificacao-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test - ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  docker-build:
    needs: [detect-changes, build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-server
          - vendas-service
          - estoque-service
          - frete-service
          - pagamento-service
          - transportadora-service
          - notificacao-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push - ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  summary:
    needs: [build-and-test, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Build | Docker |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          for svc in api-gateway discovery-server vendas-service estoque-service frete-service pagamento-service transportadora-service notificacao-service; do
            test_result="${{ needs.build-and-test.result }}"
            docker_result="${{ needs.docker-build.result }}"
            echo "| $svc | $test_result | $docker_result |" >> $GITHUB_STEP_SUMMARY
          done
