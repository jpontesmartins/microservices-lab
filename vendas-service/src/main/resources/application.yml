spring:
  application:
    name: vendas-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: vendas service

resilience4j:
  circuitbreaker:
    instances:
      estoque:
        # === Janela Deslizante ===
        # COUNT_BASED: janela contabiliza chamadas. TIME_BASED: janela contabiliza tempo.
        slidingWindowType: COUNT_BASED
        # Quantidade de chamadas na janela para calcular a taxa de falha.
        slidingWindowSize: 10
        # Minimo de chamadas antes de avaliar a taxa de falha (evita abrir com poucos dados).
        minimumNumberOfCalls: 5
        # === Limiares de Falha ===
        # Percentual de falhas que dispara a transicao para OPEN.
        failureRateThreshold: 50
        # Chamadas lentas tambem contam como "insatisfatorias" ( Slow Call ).
        slowCallRateThreshold: 60
        # Se uma chamada durar mais que isso, e considerada lenta.
        slowCallDurationThreshold: 2s
        # === Estado OPEN → HALF_OPEN ===
        # Tempo que o circuit breaker fica OPEN antes de tentar HALF_OPEN.
        waitDurationInOpenState: 10s
        # Quantas chamadas sao permitidas no estado HALF_OPEN para testar se o servico voltou.
        permittedNumberOfCallsInHalfOpenState: 3
        # Transicao automatica de OPEN para HALF_OPEN apos waitDuration (sem precisar de chamada).
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Erros de negocio (4xx) nao devem abrir o circuito.
        ignoreExceptions:
          - com.example.vendas.integration.BusinessException
      pagamento:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.example.vendas.integration.BusinessException
      frete:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.example.vendas.integration.BusinessException

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"
