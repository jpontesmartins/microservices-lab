spring:
  application:
    name: pagamento-service

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

pagamento:
  # Ajuste para forcar erros e observar o circuit breaker do vendas-service abrindo.
  failRate: 0.2
  delayMs: 0
