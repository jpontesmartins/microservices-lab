spring:
  application:
    name: pagamento-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/microservices

server:
  port: 8083
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: pagamento service

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

pagamento:
  # Ajuste para forcar erros e observar o circuit breaker do vendas-service abrindo.
  # valor de 0 (nenhum) a 1 (100%).
  failRate: 0.1
  delayMs: 0
