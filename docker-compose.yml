version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ms-net

  discovery:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ms-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
    ports:
      - "8080:8080"
    networks:
      - ms-net

  vendas-service:
    build:
      context: ./vendas-service
      dockerfile: Dockerfile
    container_name: vendas-service
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    networks:
      - ms-net

  estoque-service:
    build:
      context: ./estoque-service
      dockerfile: Dockerfile
    container_name: estoque-service
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
    ports:
      - "8082:8082"
    networks:
      - ms-net

  pagamento-service:
    build:
      context: ./pagamento-service
      dockerfile: Dockerfile
    container_name: pagamento-service
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
    ports:
      - "8083:8083"
    networks:
      - ms-net

  frete-service:
    build:
      context: ./frete-service
      dockerfile: Dockerfile
    container_name: frete-service
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
    ports:
      - "8084:8084"
    networks:
      - ms-net

  transportadora-service:
    build:
      context: ./transportadora-service
      dockerfile: Dockerfile
    container_name: transportadora-service
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8085:8085"
    networks:
      - ms-net

  notificacao-service:
    build:
      context: ./notificacao-service
      dockerfile: Dockerfile
    container_name: notificacao-service
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8086:8086"
    networks:
      - ms-net

networks:
  ms-net:
    driver: bridge
