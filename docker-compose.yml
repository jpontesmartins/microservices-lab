version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8087
    ports:
      - "8087:8087"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8087
    networks:
      - ms-net

  discovery:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ms-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8180"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
    networks:
      - ms-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/microservices
    ports:
      - "8080:8080"
    networks:
      - ms-net

  vendas-service:
    build:
      context: ./vendas-service
      dockerfile: Dockerfile
    container_name: vendas-service
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres-vendas:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-vendas:5432/${POSTGRES_VENDAS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_VENDAS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_VENDAS_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/microservices
    ports:
      - "8081:8081"
    networks:
      - ms-net

  estoque-service:
    build:
      context: ./estoque-service
      dockerfile: Dockerfile
    container_name: estoque-service
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
      postgres-estoque:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-estoque:5432/${POSTGRES_ESTOQUE_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_ESTOQUE_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_ESTOQUE_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/microservices
    ports:
      - "8082:8082"
    networks:
      - ms-net

  pagamento-service:
    build:
      context: ./pagamento-service
      dockerfile: Dockerfile
    container_name: pagamento-service
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/microservices
    ports:
      - "8083:8083"
    networks:
      - ms-net

  frete-service:
    build:
      context: ./frete-service
      dockerfile: Dockerfile
    container_name: frete-service
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8180/realms/microservices
    ports:
      - "8084:8084"
    networks:
      - ms-net

  transportadora-service:
    build:
      context: ./transportadora-service
      dockerfile: Dockerfile
    container_name: transportadora-service
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
    ports:
      - "8085:8085"
    networks:
      - ms-net

  notificacao-service:
    build:
      context: ./notificacao-service
      dockerfile: Dockerfile
    container_name: notificacao-service
    depends_on:
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      - EUREKA_URI=http://discovery:8761/eureka
      - ZIPKIN_BASE_URL=http://host.docker.internal:9411
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8087
    ports:
      - "8086:8086"
    networks:
      - ms-net

  postgres-vendas:
    image: postgres:14
    container_name: postgres-vendas
    environment:
      POSTGRES_DB: ${POSTGRES_VENDAS_DB}
      POSTGRES_USER: ${POSTGRES_VENDAS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_VENDAS_PASSWORD}
    ports:
      - "${POSTGRES_VENDAS_PORT}:5432"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-estoque:
    image: postgres:14
    container_name: postgres-estoque
    environment:
      POSTGRES_DB: ${POSTGRES_ESTOQUE_DB}
      POSTGRES_USER: ${POSTGRES_ESTOQUE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ESTOQUE_PASSWORD}
    ports:
      - "${POSTGRES_ESTOQUE_PORT}:5432"
    networks:
      - ms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ms-net:
    driver: bridge
